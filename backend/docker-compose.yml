version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=INSECURE_CHANGE_ME_IN_PRODUCTION
      - DATABASE_URL=sqlite+aiosqlite:///./cadastravision.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
