openapi: 3.1.0
info:
  title: CadastraVision API
  description: "AI-enabled automated cadastral mapping platform. Programme: CadastralMap\
    \ \u2014 SIH 2026, PS 26012. Backend owner: Shiva."
  version: 0.2.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: 'Lightweight liveness probe.


        Returns a static JSON payload that load-balancers and orchestration

        platforms (Kubernetes, ECS, Railway, etc.) can poll.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/auth/token:
    post:
      tags:
      - Authentication
      summary: Obtain access token
      description: "Exchange credentials for a JWT access + refresh token pair. **STUB**\
        \ \u2014 real JWT implementation: Prajith (Phase 3)."
      operationId: get_token_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh access token
      description: "Exchange a refresh token for a new token pair. **STUB** \u2014\
        \ Phase 3."
      operationId: refresh_token_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imagery/upload:
    post:
      tags:
      - Imagery
      summary: Upload imagery tile
      description: "Upload a satellite or drone imagery tile for AI processing. Returns\
        \ tile_id and job_id immediately \u2014 processing is dispatched."
      operationId: upload_imagery_v1_imagery_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_imagery_v1_imagery_upload_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imagery/jobs/{job_id}:
    get:
      tags:
      - Imagery
      summary: Get processing job status
      description: Poll the status of an imagery processing job.
      operationId: get_job_status_v1_imagery_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imagery/jobs/{job_id}/retry:
    post:
      tags:
      - Imagery
      summary: Retry a processing job
      description: Safely retry a failed or queued imagery processing job. Idempotent.
      operationId: retry_job_v1_imagery_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imagery/tiles/{tile_id}:
    get:
      tags:
      - Imagery
      summary: Get imagery tile metadata
      description: Retrieve metadata for an uploaded imagery tile.
      operationId: get_tile_v1_imagery_tiles__tile_id__get
      parameters:
      - name: tile_id
        in: path
        required: true
        schema:
          type: string
          title: Tile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imagery/tiles/{tile_id}/features:
    get:
      tags:
      - Imagery
      summary: Get AI-extracted features for a tile
      description: List building footprints and other features extracted from a tile.
      operationId: get_tile_features_v1_imagery_tiles__tile_id__features_get
      parameters:
      - name: tile_id
        in: path
        required: true
        schema:
          type: string
          title: Tile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TileFeaturesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/sync:
    post:
      tags:
      - Parcels
      summary: Offline sync batch
      description: "Submit a batch of offline actions. Each action requires a ``client_action_id``\
        \ for idempotent replay. Conflicts are surfaced explicitly \u2014 no silent\
        \ last-write-wins."
      operationId: sync_parcels_v1_parcels_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels:
    get:
      tags:
      - Parcels
      summary: List parcels
      description: 'Cursor-paginated list of parcels with optional filters. Filters:
        zone, jurisdiction, validation_status, confidence_min/max.'
      operationId: list_parcels_v1_parcels_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination cursor
          title: Cursor
        description: Pagination cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: zone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      - name: validation_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ParcelWorkflowStatus'
          - type: 'null'
          title: Validation Status
      - name: confidence_min
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence Min
      - name: confidence_max
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence Max
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ParcelSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/{parcel_id}:
    get:
      tags:
      - Parcels
      summary: Get parcel detail
      description: Retrieve full parcel representation including geometry.
      operationId: get_parcel_v1_parcels__parcel_id__get
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/{parcel_id}/edit:
    post:
      tags:
      - Parcels
      summary: Edit parcel geometry
      description: Apply a vertex edit, split, or merge operation to a parcel. Triggers
        topology validation hook (Arun). ``idempotency_key`` prevents duplicate edits
        on retry.
      operationId: edit_parcel_v1_parcels__parcel_id__edit_post
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/{parcel_id}/approve:
    post:
      tags:
      - Parcels
      summary: Approve parcel
      description: "Human sign-off \u2014 marks the parcel as approved and eligible\
        \ for export. Requires the parcel to be in 'validated' status."
      operationId: approve_parcel_v1_parcels__parcel_id__approve_post
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/{parcel_id}/reject:
    post:
      tags:
      - Parcels
      summary: Reject parcel
      description: Mark a parcel as rejected. Record is preserved for audit history.
      operationId: reject_parcel_v1_parcels__parcel_id__reject_post
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/validations/queue:
    get:
      summary: Validation queue
      description: List parcels awaiting topology or confidence validation.
      operationId: get_validation_queue_v1_validations_queue_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationQueueResponse'
  /v1/validations/run:
    post:
      summary: Trigger validation run
      description: Trigger topology and confidence validation for a set of parcels.
      operationId: run_validation_v1_validations_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parcels/{parcel_id}/flags:
    get:
      tags:
      - Validation
      summary: Get validation flags for a parcel
      description: List all validation flags on a specific parcel.
      operationId: get_parcel_flags_v1_parcels__parcel_id__flags_get
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelFlagsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conflicts:
    get:
      tags:
      - Conflicts
      summary: List open conflicts
      description: "List spatial or data conflicts between parcels. **STUB** \u2014\
        \ Phase 3."
      operationId: list_conflicts_v1_conflicts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictsResponse'
  /v1/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - Conflicts
      summary: Resolve conflict
      description: "Apply a resolution strategy to a detected conflict. **STUB** \u2014\
        \ Phase 3."
      operationId: resolve_conflict_v1_conflicts__conflict_id__resolve_post
      parameters:
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          title: Conflict Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveConflictResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/change-detection/run:
    post:
      tags:
      - Change Detection
      summary: Run change detection
      description: "Compare two imagery tiles to detect land-use changes. **STUB**\
        \ \u2014 Akshaya's pipeline (Phase 3)."
      operationId: run_change_detection_v1_change_detection_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDetectionRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeDetectionRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/change-detection/{job_id}:
    get:
      tags:
      - Change Detection
      summary: Get change detection job status
      description: "Poll the status of a change detection job. **STUB** \u2014 Phase\
        \ 3."
      operationId: get_change_detection_job_v1_change_detection__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeDetectionJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/geo/parcels:
    get:
      tags:
      - Geographic Data
      summary: Get parcels as GeoJSON
      description: "Return all (or filtered) parcels as a GeoJSON FeatureCollection.\
        \ Supports bbox, zone, and jurisdiction filters. **STUB** \u2014 Phase 3:\
        \ real spatial query."
      operationId: get_geo_parcels_v1_geo_parcels_get
      parameters:
      - name: bbox
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Bounding box: minLon,minLat,maxLon,maxLat'
          title: Bbox
        description: 'Bounding box: minLon,minLat,maxLon,maxLat'
      - name: zone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Zone
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoFeatureCollection'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/exports:
    post:
      tags:
      - Exports
      summary: Create export
      description: "Enqueue a data export (GeoJSON, Shapefile, GeoPackage, CSV). **STUB**\
        \ \u2014 Phase 3."
      operationId: create_export_v1_exports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/exports/{export_id}:
    get:
      tags:
      - Exports
      summary: Get export status
      description: "Poll the status of an export job. **STUB** \u2014 Phase 3."
      operationId: get_export_status_v1_exports__export_id__get
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
          title: Export Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audit/verify/{parcel_id}:
    get:
      tags:
      - Audit
      summary: Verify audit chain integrity
      description: Verify the SHA-256 hash-chain integrity for a parcel's audit trail.
      operationId: verify_audit_chain_v1_audit_verify__parcel_id__get
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audit/export/{batch_id}:
    get:
      tags:
      - Audit
      summary: Export audit batch
      description: Export a batch of audit log entries.
      operationId: export_audit_batch_v1_audit_export__batch_id__get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audit/{parcel_id}:
    get:
      tags:
      - Audit
      summary: Get parcel audit trail
      description: Retrieve the complete audit trail for a parcel.
      operationId: get_parcel_audit_v1_audit__parcel_id__get
      parameters:
      - name: parcel_id
        in: path
        required: true
        schema:
          type: string
          title: Parcel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models/metrics:
    get:
      tags:
      - Metrics
      summary: Get AI model metrics
      description: "Retrieve performance metrics for the deployed segmentation model.\
        \ **INTEGRATION STUB** \u2014 Akshaya's model pipeline populates this (Phase\
        \ 3)."
      operationId: get_model_metrics_v1_models_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetrics'
components:
  schemas:
    ApproveRequest:
      properties:
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      title: ApproveRequest
      description: POST /v1/parcels/{parcel_id}/approve.
    AuditAction:
      type: string
      enum:
      - create
      - edit
      - approve
      - reject
      - sync
      - view
      - login
      - logout
      title: AuditAction
    AuditEntryResponse:
      properties:
        entry_id:
          type: string
          title: Entry Id
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        action:
          $ref: '#/components/schemas/AuditAction'
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        diff_json:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Diff Json
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        created_at:
          type: string
          format: date-time
          title: Created At
        entry_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Entry Hash
          description: "SHA-256 hash of this entry (Prajith's chain \u2014 stub in\
            \ Phase 2)"
      type: object
      required:
      - entry_id
      - entity_type
      - entity_id
      - action
      - created_at
      title: AuditEntryResponse
    AuditExportResponse:
      properties:
        batch_id:
          type: string
          title: Batch Id
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Url
        status:
          type: string
          title: Status
        entry_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Entry Count
      type: object
      required:
      - batch_id
      - status
      title: AuditExportResponse
      description: GET /v1/audit/export/{batch_id}.
    AuditTrailResponse:
      properties:
        parcel_id:
          type: string
          title: Parcel Id
        entries:
          items:
            $ref: '#/components/schemas/AuditEntryResponse'
          type: array
          title: Entries
        total:
          type: integer
          title: Total
      type: object
      required:
      - parcel_id
      - entries
      - total
      title: AuditTrailResponse
      description: GET /v1/audit/{parcel_id}.
    AuditVerifyResponse:
      properties:
        parcel_id:
          type: string
          title: Parcel Id
        chain_valid:
          type: boolean
          title: Chain Valid
        entry_count:
          type: integer
          title: Entry Count
        verification_note:
          type: string
          title: Verification Note
          default: 'Hash-chain verification: integration stub (Phase 2)'
      type: object
      required:
      - parcel_id
      - chain_valid
      - entry_count
      title: AuditVerifyResponse
      description: GET /v1/audit/verify/{parcel_id}.
    Body_upload_imagery_v1_imagery_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
          description: GeoTIFF or supported imagery file
        source:
          $ref: '#/components/schemas/TileSource'
          default: satellite
        crs:
          anyOf:
          - type: string
