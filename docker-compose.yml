version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gispassword}
      POSTGRES_DB: ${POSTGRES_DB:-cadastralmap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gisuser}:${POSTGRES_PASSWORD:-gispassword}@postgres:5432/${POSTGRES_DB:-cadastralmap}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  postgres_data:
